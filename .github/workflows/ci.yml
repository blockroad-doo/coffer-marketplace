name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
          cache: false

      - name: Install solhint
        run: npm i -g solhint

      - name: Run lint
        run: make lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
          cache: false

      - name: Build
        run: forge build --sizes --deny warnings

  slither:
    name: Slither
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
          cache: false

      - name: Build for Slither
        run: forge build --build-info --skip test script

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          fail-on: low

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
          cache: false

      - name: Set weekly fuzz seed
        run: >
          echo "FOUNDRY_FUZZ_SEED=$(
            echo $(($EPOCHSECONDS / 604800))
          )" >> $GITHUB_ENV

      - name: Build
        run: forge build

      - name: Run local tests
        run: >
          FOUNDRY_PROFILE=ci forge test
          --isolate
          -vvv
          --show-progress

      - name: Coverage
        run: >
          forge coverage
          --no-match-coverage "^test/|^script/"
          --report summary
