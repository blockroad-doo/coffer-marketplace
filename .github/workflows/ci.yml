name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install solhint
        run: npm ci

      - name: Run lint
        run: make lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
          cache: false

      - name: Build
        run: forge build --sizes --deny warnings

  slither:
    name: Slither
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
          cache: false

      - name: Build for Slither
        run: forge build --build-info --skip test script

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          fail-on: low

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
          cache: false

      - name: Set weekly fuzz seed
        run: >
          echo "FOUNDRY_FUZZ_SEED=$(
            echo $(($EPOCHSECONDS / 604800))
          )" >> $GITHUB_ENV

      - name: Build
        run: forge build

      - name: Run local tests
        run: >
          FOUNDRY_PROFILE=ci forge test
          --isolate
          -vvv
          --show-progress

      - name: Coverage
        run: >
          forge coverage
          --no-match-coverage "^test/|^script/"
          --report summary

  invariant:
    name: Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
          cache: false

      # The invariant fuzzer's RNG is seeded from fuzz.seed (there is no invariant.seed), so the
      # same weekly seed as the unit job makes a given week's run reproducible locally.
      - name: Set weekly fuzz seed
        run: >
          echo "FOUNDRY_FUZZ_SEED=$(
            echo $(($EPOCHSECONDS / 604800))
          )" >> $GITHUB_ENV

      - name: Build
        run: forge build

      # A misspelled or missing profile only warns on stderr, falls back to the default profile
      # (which excludes test/invariant), reports "No tests match" and exits 0. Fail loudly instead.
      - name: Check the profile selects the invariant suite
        run: >
          FOUNDRY_PROFILE=invariants forge test --list
          | grep -q "invariant_ethConservation"

      - name: Run invariant tests
        run: >
          FOUNDRY_PROFILE=invariants FOUNDRY_INVARIANT_RUNS=256 forge test
          -vvv
          --show-progress
