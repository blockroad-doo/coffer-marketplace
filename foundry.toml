[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.34"
# Pinned so bytecode semantics do not follow whatever forge release is installed.
evm_version = "osaka"
optimizer = false
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]
no_match_coverage = "^test/|^script/|^integration/|^audit-poc/"

# Keeps plain `forge test` (and the ci profile) on the unit suite. This filter applies even under
# --match-path, so `forge test --mp "test/invariant/*"` selects zero tests here; run the invariant
# suite through its profile:  FOUNDRY_PROFILE=invariants forge test
no_match_path = "test/{invariant,integration}/*"

[fuzz]
runs = 1024

# ── Invariant Fuzz Testing ──────────────────────────────────────────────
# Unit tests only (default):    forge test
# Invariant suite only:         FOUNDRY_PROFILE=invariants forge test -vv
# Shorter / longer campaigns:   FOUNDRY_INVARIANT_RUNS=64 FOUNDRY_INVARIANT_DEPTH=200 ...
# Coverage (excludes test/):    forge coverage --report summary
#
# [invariant] is a standalone section, so it applies to every profile. runs/depth stay explicit
# because an unset key falls back to [fuzz] (runs would become 1024). fail_on_revert must stay
# true: the handler uses vm.expectRevert as an exact revert oracle and assertEq for per-fill
# postconditions, and both surface as handler reverts that a permissive run silently swallows.
# ────────────────────────────────────────────────────────────────────────

[invariant]
runs = 512
depth = 64
fail_on_revert = true

# Invariant suite profile. A named profile inherits solc, evm_version, skip and [invariant] from
# default; no_match_path is restated because a profile value REPLACES the default's (it does not
# merge), and dropping "invariant" from the glob is what admits the suite. A future per-profile
# override table would be [profile.invariants.invariant] (profile "invariants", section "invariant").
[profile.invariants]
match_path = "test/invariant/*"
no_match_path = "test/{integration,audit-poc}/*"

# CI profile: inherits the default exclusions (invariant/integration/audit-poc). Do not set
# no_match_path here — a profile value REPLACES the default's, it does not merge, and a narrower
# glob would re-admit the audit-poc tree into CI test runs.
[profile.ci]

[lint]
# The post-build lint (forge 1.8) gates the CI Build job through --deny warnings, so it is scoped
# to src, the same scope as slither.config.json filter_paths. The glob needs the file component:
# a trailing "**" matches no files and a "./" prefix matches nothing at all.
ignore = ["test/**/*.sol", "script/**/*.sol"]
# reentrancy-events mirrors the slither.config.json triage: cancelListings and cancelOffers emit
# after a loop of storage writes, there is no external call in either.
exclude_lints = ["mixed-case-function", "reentrancy-events"]
