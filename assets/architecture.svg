<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#fafafa" rx="4"/>

  <!-- ===== ROW 1 — ACTORS ===== -->

  <!-- Seller -->
  <rect x="80" y="20" width="180" height="50" rx="25" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
  <text x="170" y="51" text-anchor="middle" font-weight="600" font-size="14">Seller</text>

  <!-- Buyer -->
  <rect x="700" y="20" width="180" height="50" rx="25" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
  <text x="790" y="51" text-anchor="middle" font-weight="600" font-size="14">Buyer</text>

  <!-- ===== ROW 2 — CORE CONTRACT ===== -->

  <!-- CofferMarketplace -->
  <rect x="280" y="130" width="400" height="230" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
  <text x="480" y="155" text-anchor="middle" font-weight="700" font-size="14" fill="#2e7d32">CofferMarketplace</text>
  <text x="480" y="174" text-anchor="middle" font-size="11" fill="#555" font-style="italic">(trustless — no owner, no fees)</text>
  <line x1="295" y1="183" x2="665" y2="183" stroke="#4caf50" stroke-width="0.5" stroke-opacity="0.5"/>

  <!-- Left column: Listings -->
  <text x="370" y="204" text-anchor="middle" font-weight="600" font-size="12" fill="#333">Listings (ETH)</text>
  <text x="310" y="224" font-size="12" fill="#333" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">list()</text>
  <text x="310" y="244" font-size="12" fill="#333" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">buy()</text>
  <text x="310" y="264" font-size="12" fill="#333" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cancelListing()</text>

  <!-- Vertical divider -->
  <line x1="480" y1="190" x2="480" y2="280" stroke="#4caf50" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Right column: Offers -->
  <text x="580" y="204" text-anchor="middle" font-weight="600" font-size="12" fill="#333">Offers (WETH)</text>
  <text x="510" y="224" font-size="12" fill="#333" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">makeOffer()</text>
  <text x="510" y="244" font-size="12" fill="#333" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">acceptOffer()</text>
  <text x="510" y="264" font-size="12" fill="#333" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cancelOffer()</text>

  <!-- Bottom section -->
  <line x1="295" y1="283" x2="665" y2="283" stroke="#4caf50" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="480" y="305" text-anchor="middle" font-size="11" fill="#555" font-style="italic">+ batch variants, 3 view functions</text>

  <!-- Safety badges -->
  <text x="480" y="330" text-anchor="middle" font-size="10" fill="#777">ReentrancyGuard · CEI pattern · front-running protection</text>
  <text x="480" y="345" text-anchor="middle" font-size="10" fill="#777">bond outstanding check · seller ownership verification</text>

  <!-- ===== ROW 3 — EXTERNAL CONTRACTS ===== -->

  <!-- CofferBondNft -->
  <rect x="55" y="420" width="230" height="60" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="170" y="446" text-anchor="middle" font-weight="700" font-size="14" fill="#6a1b9a">CofferBondNft</text>
  <text x="170" y="466" text-anchor="middle" font-size="11" fill="#555" font-style="italic">ERC-721</text>

  <!-- Coffer -->
  <rect x="370" y="420" width="220" height="60" rx="8" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5"/>
  <text x="480" y="446" text-anchor="middle" font-weight="700" font-size="14" fill="#1565c0">Coffer</text>
  <text x="480" y="466" text-anchor="middle" font-size="11" fill="#555" font-style="italic">sHolderConditions()</text>

  <!-- WETH -->
  <rect x="685" y="420" width="180" height="60" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="775" y="446" text-anchor="middle" font-weight="700" font-size="14" fill="#e65100">WETH</text>
  <text x="775" y="466" text-anchor="middle" font-size="11" fill="#555" font-style="italic">ERC-20</text>

  <!-- ===== ARROWS ===== -->

  <!-- 1. Seller → Marketplace -->
  <line x1="170" y1="70" x2="370" y2="125" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="88" font-size="10" fill="#555">list() / acceptOffer()</text>

  <!-- 2. Buyer → Marketplace -->
  <line x1="790" y1="70" x2="590" y2="125" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="88" font-size="10" fill="#555">buy() / makeOffer()</text>

  <!-- 3. Marketplace → Seller (ETH payment, green dashed) -->
  <line x1="340" y1="130" x2="200" y2="75" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-green)"/>
  <text x="225" y="115" font-size="10" fill="#2e7d32" font-weight="600">100% ETH to seller</text>

  <!-- 4. Marketplace → Buyer via WETH (green dashed) -->
  <line x1="620" y1="130" x2="760" y2="75" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-green)"/>
  <text x="665" y="115" font-size="10" fill="#2e7d32" font-weight="600">NFT to buyer</text>

  <!-- 5. Marketplace → CofferBondNft -->
  <line x1="370" y1="360" x2="220" y2="415" stroke="#555" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="248" y="382" font-size="10" fill="#555">transferFrom / ownerOf</text>

  <!-- 6. CofferBondNft → Coffer -->
  <line x1="285" y1="450" x2="363" y2="450" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="324" y="440" text-anchor="middle" font-size="10" fill="#555">cofferOf()</text>

  <!-- 7. Marketplace → WETH -->
  <line x1="590" y1="360" x2="740" y2="415" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="382" font-size="10" fill="#555">safeTransferFrom()</text>

  <!-- 8. WETH payment label (100% to seller) -->
  <text x="775" y="505" text-anchor="middle" font-size="10" fill="#2e7d32" font-weight="600">100% WETH to seller</text>
</svg>
